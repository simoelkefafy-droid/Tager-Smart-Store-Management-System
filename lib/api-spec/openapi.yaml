openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API for Tager small-shop management
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tager
    description: Shop inventory and sales operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [tager]
      summary: List products
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [tager]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [tager]
      summary: Update a product
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
    delete:
      operationId: deleteProduct
      tags: [tager]
      summary: Delete a product
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Product deleted
        "409":
          description: Product is used in a sale
  /suppliers:
    get:
      operationId: listSuppliers
      tags: [tager]
      summary: List suppliers
      responses:
        "200":
          description: Supplier list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"
    post:
      operationId: createSupplier
      tags: [tager]
      summary: Create a supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "201":
          description: Created supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
  /suppliers/{id}:
    patch:
      operationId: updateSupplier
      tags: [tager]
      summary: Update a supplier
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "200":
          description: Updated supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "404":
          description: Supplier not found
    delete:
      operationId: deleteSupplier
      tags: [tager]
      summary: Delete a supplier
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Supplier deleted
        "404":
          description: Supplier not found
  /sales:
    get:
      operationId: listSales
      tags: [tager]
      summary: List recent sales
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Sales list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
    post:
      operationId: createSale
      tags: [tager]
      summary: Create a sale and reduce inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
      responses:
        "201":
          description: Created sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "400":
          description: Invalid sale
        "409":
          description: Insufficient stock
  /dashboard:
    get:
      operationId: getDashboard
      tags: [tager]
      summary: Get dashboard summary and recent sales
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /reports:
    get:
      operationId: getReports
      tags: [tager]
      summary: Get sales report for a date range
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Sales and profit report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      required: [id, name, category, purchasePrice, sellingPrice, quantity, minStock]
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        purchasePrice: { type: number }
        sellingPrice: { type: number }
        quantity: { type: integer }
        minStock: { type: integer }
        supplierId: { type: ["integer", "null"] }
    ProductInput:
      type: object
      required: [name, category, purchasePrice, sellingPrice, quantity, minStock]
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        purchasePrice: { type: number, minimum: 0 }
        sellingPrice: { type: number, minimum: 0 }
        quantity: { type: integer, minimum: 0 }
        minStock: { type: integer, minimum: 0 }
        supplierId: { type: ["integer", "null"] }
    Supplier:
      type: object
      required: [id, name, phone, products]
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: string }
        products: { type: string }
    SupplierInput:
      type: object
      required: [name, phone, products]
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: string }
        products: { type: string }
    SaleItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: integer, minimum: 1 }
        quantity: { type: integer, minimum: 1 }
    SaleInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SaleItemInput"
    SaleLine:
      type: object
      required: [productId, productName, quantity, unitPrice, lineTotal, unitCost]
      properties:
        productId: { type: integer }
        productName: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
        lineTotal: { type: number }
        unitCost: { type: number }
    Sale:
      type: object
      required: [id, total, profit, createdAt, items]
      properties:
        id: { type: integer }
        total: { type: number }
        profit: { type: number }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items:
            $ref: "#/components/schemas/SaleLine"
    Dashboard:
      type: object
      required: [totalSales, totalProfit, productsCount, lowStockCount, lowStockProducts, recentSales]
      properties:
        totalSales: { type: number }
        totalProfit: { type: number }
        productsCount: { type: integer }
        lowStockCount: { type: integer }
        lowStockProducts:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        recentSales:
          type: array
          items: { $ref: "#/components/schemas/Sale" }
    DailyReport:
      type: object
      required: [date, sales, profit]
      properties:
        date: { type: string, format: date }
        sales: { type: number }
        profit: { type: number }
    BestSeller:
      type: object
      required: [productId, name, quantity, revenue]
      properties:
        productId: { type: integer }
        name: { type: string }
        quantity: { type: integer }
        revenue: { type: number }
    Report:
      type: object
      required: [totalSales, estimatedProfit, salesCount, daily, bestSellers]
      properties:
        totalSales: { type: number }
        estimatedProfit: { type: number }
        salesCount: { type: integer }
        daily:
          type: array
          items: { $ref: "#/components/schemas/DailyReport" }
        bestSellers:
          type: array
          items: { $ref: "#/components/schemas/BestSeller" }

