openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API for Tager small-shop management
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tager
    description: Shop inventory and sales operations
paths:
  /purchases:
    get:
      operationId: listPurchases
      tags: [tager]
      responses:
        "200":
          description: Recorded purchases
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Purchase" }
    post:
      operationId: createPurchase
      tags: [tager]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurchaseInput" }
      responses:
        "201":
          description: Received purchase
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Purchase" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [tager]
      summary: List products
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [tager]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [tager]
      summary: Update a product
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
    delete:
      operationId: deleteProduct
      tags: [tager]
      summary: Delete a product
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Product deleted
        "409":
          description: Product is used in a sale
  /suppliers:
    get:
      operationId: listSuppliers
      tags: [tager]
      summary: List suppliers
      responses:
        "200":
          description: Supplier list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"
    post:
      operationId: createSupplier
      tags: [tager]
      summary: Create a supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "201":
          description: Created supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
  /suppliers/{id}:
    patch:
      operationId: updateSupplier
      tags: [tager]
      summary: Update a supplier
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "200":
          description: Updated supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "404":
          description: Supplier not found
    delete:
      operationId: deleteSupplier
      tags: [tager]
      summary: Delete a supplier
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Supplier deleted
        "404":
          description: Supplier not found
  /sales:
    get:
      operationId: listSales
      tags: [tager]
      summary: List recent sales
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Sales list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
    post:
      operationId: createSale
      tags: [tager]
      summary: Create a sale and reduce inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
      responses:
        "201":
          description: Created sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "400":
          description: Invalid sale
        "409":
          description: Insufficient stock
  /inventory-movements:
    get:
      operationId: listInventoryMovements
      tags: [tager]
      summary: List inventory movements
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: type
          schema:
            type: string
            enum: [opening, sale, supply, adjustment]
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Inventory movement history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryMovementsPage"
        "400":
          description: Invalid filters or pagination
  /inventory-movements/export:
    get:
      operationId: exportInventoryMovements
      tags: [tager]
      summary: Export filtered inventory movements as CSV
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: type
          schema:
            type: string
            enum: [opening, sale, supply, adjustment]
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        "200":
          description: All matching inventory movements as CSV
          content:
            text/csv:
              schema: { type: string }
        "400":
          description: Invalid filters or missing date range
    post:
      operationId: createInventorySupply
      tags: [tager]
      summary: Record inventory supply
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventorySupplyInput" }
      responses:
        "201":
          description: Supply recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryMovement" }
        "400":
          description: Invalid supply
        "409":
          description: Replayed request
  /dashboard:
    get:
      operationId: getDashboard
      tags: [tager]
      summary: Get dashboard summary and recent sales
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /reports:
    get:
      operationId: getReports
      tags: [tager]
      summary: Get sales report for a date range
      parameters:
        - in: query
          name: productId
          schema: { type: integer, minimum: 1 }
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Sales and profit report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      required: [id, name, category, purchasePrice, sellingPrice, quantity, minStock]
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        purchasePrice: { type: number }
        sellingPrice: { type: number }
        quantity: { type: integer }
        minStock: { type: integer }
        supplierId: { type: ["integer", "null"] }
    PurchaseInput:
      type: object
      required: [supplierId, requestId, items]
      properties:
        supplierId: { type: integer, minimum: 1 }
        requestId: { type: string, minLength: 1, maxLength: 100 }
        reference: { type: string, maxLength: 200 }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [productId, quantity, unitCost]
            properties:
              productId: { type: integer, minimum: 1 }
              quantity: { type: integer, minimum: 1, maximum: 1000000 }
              unitCost: { type: number, minimum: 0, maximum: 1000000, multipleOf: 0.01 }
    Purchase:
      type: object
      required: [id, supplierName, reference, total, createdAt, items]
      properties:
        id: { type: integer }
        supplierId: { type: ["integer", "null"] }
        supplierName: { type: string }
        reference: { type: string }
        total: { type: number }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            required: [productId, productName, quantity, unitCost, lineTotal]
            properties:
              productId: { type: integer }
              productName: { type: string }
              quantity: { type: integer }
              unitCost: { type: number }
              lineTotal: { type: number }
    ProductInput:
      type: object
      required: [name, category, purchasePrice, sellingPrice, quantity, minStock]
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        purchasePrice: { type: number, minimum: 0 }
        sellingPrice: { type: number, minimum: 0 }
        quantity: { type: integer, minimum: 0 }
        minStock: { type: integer, minimum: 0 }
        supplierId: { type: ["integer", "null"] }
        reason: { type: string, maxLength: 500 }
    Supplier:
      type: object
      required: [id, name, phone, products]
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: string }
        products: { type: string }
    SupplierInput:
      type: object
      required: [name, phone, products]
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: string }
        products: { type: string }
    SaleItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: integer, minimum: 1 }
        quantity: { type: integer, minimum: 1 }
    SaleInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SaleItemInput"
    SaleLine:
      type: object
      required: [productId, productName, quantity, unitPrice, lineTotal, unitCost]
      properties:
        productId: { type: integer }
        productName: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
        lineTotal: { type: number }
        unitCost: { type: number }
    Sale:
      type: object
      required: [id, total, profit, createdAt, items]
      properties:
        id: { type: integer }
        total: { type: number }
        profit: { type: number }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items:
            $ref: "#/components/schemas/SaleLine"
    InventoryMovement:
      type: object
      required: [id, productId, productName, type, quantity, reason, balanceBefore, balanceAfter, saleId, supplierId, supplierName, createdAt]
      properties:
        id: { type: integer }
        productId: { type: ["integer", "null"] }
        productName: { type: string }
        type: { type: string, enum: [opening, sale, supply, adjustment] }
        quantity: { type: integer, minimum: 1 }
        reason: { type: string }
        balanceBefore: { type: integer, minimum: 0 }
        balanceAfter: { type: integer, minimum: 0 }
        saleId: { type: ["integer", "null"] }
        supplierId: { type: ["integer", "null"] }
        supplierName: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    InventoryMovementsPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InventoryMovement" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
    InventorySupplyInput:
      type: object
      required: [productId, quantity, reason, requestId]
      properties:
        productId: { type: integer, minimum: 1 }
        supplierId: { type: ["integer", "null"] }
        quantity: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        requestId: { type: string, minLength: 1, maxLength: 100 }
    Dashboard:
      type: object
      required: [totalSales, totalProfit, productsCount, lowStockCount, lowStockProducts, recentSales]
      properties:
        totalSales: { type: number }
        totalProfit: { type: number }
        productsCount: { type: integer }
        lowStockCount: { type: integer }
        lowStockProducts:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        recentSales:
          type: array
          items: { $ref: "#/components/schemas/Sale" }
    DailyReport:
      type: object
      required: [date, sales, profit, cost, salesCount]
      properties:
        date: { type: string, format: date }
        sales: { type: number }
        profit: { type: ["number", "null"] }
        cost: { type: ["number", "null"] }
        salesCount: { type: integer }
    BestSeller:
      type: object
      required: [productId, name, quantity, revenue, cost, profit]
      properties:
        productId: { type: integer }
        name: { type: string }
        quantity: { type: integer }
        revenue: { type: number }
        cost: { type: ["number", "null"] }
        profit: { type: ["number", "null"] }
    Report:
      type: object
      required: [totalSales, estimatedProfit, salesCount, daily, bestSellers, totalCost, missingCostLines, todaySales, monthSales, todayCount, monthCount, previousSales, previousFrom, previousTo, salesChangePercent, products, timeZone]
      properties:
        totalSales: { type: number }
        estimatedProfit: { type: ["number", "null"] }
        totalCost: { type: ["number", "null"] }
        missingCostLines: { type: integer }
        todaySales: { type: number }
        monthSales: { type: number }
        todayCount: { type: integer }
        monthCount: { type: integer }
        previousSales: { type: number }
        previousFrom: { type: string }
        previousTo: { type: string }
        salesChangePercent: { type: ["number", "null"] }
        timeZone: { type: string }
        products:
          type: array
          items: { $ref: "#/components/schemas/BestSeller" }
        salesCount: { type: integer }
        daily:
          type: array
          items: { $ref: "#/components/schemas/DailyReport" }
        bestSellers:
          type: array
          items: { $ref: "#/components/schemas/BestSeller" }

